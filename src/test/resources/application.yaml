# Config exclusiva dos testes (shadowa src/main/resources/application.yaml no classpath de teste).
# Smoke test offline: H2 em memória, schema gerado pelo Hibernate, sem tocar no Supabase,
# sem schema.sql e sem Flyway (as migrations são PostgreSQL puro).
spring:
  datasource:
    url: jdbc:h2:mem:condominio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret
    expiration-ms: 86400000
