spring:
  application:
    name: srv-condominio-pro
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/condominio_pro}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mercadopago:
    # Credenciais reais ficam em application-local.yaml (gitignored). Sem access-token a
    # integração fica desligada: criar-cobranca responde 503 e o webhook só é logado.
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
    notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
    pix-expiration-minutes: ${MERCADO_PAGO_PIX_EXPIRATION_MINUTES:30}
  # Canais de notificação (Fase 3). Sem credenciais, o canal fica desligado: eventos viram
  # no-op silencioso e POST /notificacoes/enviar responde 503.
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:CondominioPro <onboarding@resend.dev>}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_WHATSAPP_FROM:}
    base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
